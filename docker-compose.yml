services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-teamflow}
      POSTGRES_USER: ${DB_USER:-teamflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 teamtaskmanager.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      USE_POSTGRESQL: "True"
      DB_HOST: db
      DB_NAME: ${DB_NAME:-teamflow}
      DB_USER: ${DB_USER:-teamflow}
      REDIS_URL: redis://redis:6379/0

  worker:
    build: .
    command: python manage.py run_worker
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      USE_POSTGRESQL: "True"
      DB_HOST: db
      DB_NAME: ${DB_NAME:-teamflow}
      DB_USER: ${DB_USER:-teamflow}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:




