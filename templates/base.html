<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeamFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#f5f7fb;
            overflow-x:hidden;
        }

        .sidebar{
            position:fixed;
            top:0;
            left:0;
            width:260px;
            height:100vh;
            background:#0f172a;
            color:white;
            padding-top:20px;
        }

        .sidebar h3{
            text-align:center;
            margin-bottom:35px;
            font-weight:bold;
        }

        .sidebar a{
            display:block;
            color:#cbd5e1;
            text-decoration:none;
            padding:14px 25px;
            transition:.25s;
        }

        .sidebar a:hover{
            background:#1e293b;
            color:white;
        }

        .content{
            margin-left:260px;
            padding:30px;
        }

        .topbar{
            background:white;
            border-radius:12px;
            padding:15px 25px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .card-stat{
            border:none;
            border-radius:18px;
            box-shadow:0 4px 15px rgba(0,0,0,.08);
            transition:.3s;
        }

        .card-stat:hover{
            transform:translateY(-5px);
        }

        .icon-box{
            width:55px;
            height:55px;
            border-radius:15px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:24px;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3>TeamFlow</h3>

    <a href="#"><i class="bi bi-speedometer2"></i> Dashboard</a>

    <a href="/projects/"><i class="bi bi-folder2"></i> Projects</a>

    <a href="#"><i class="bi bi-list-task"></i> Tasks</a>

    <a href="#"><i class="bi bi-calendar3"></i> Calendar</a>

    <a href="#"><i class="bi bi-people"></i> Team</a>

    <a href="#"><i class="bi bi-bar-chart"></i> Reports</a>

    <a href="#"><i class="bi bi-gear"></i> Settings</a>

</div>

<div class="content">

    <div class="topbar">

        <h4>Dashboard</h4>

        <div>

            <i class="bi bi-bell fs-4 me-3"></i>

            <i class="bi bi-person-circle fs-3"></i>

        </div>

    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
