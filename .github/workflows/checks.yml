name: Project checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -c requirements.lock.txt
      - run: python manage.py check --settings=teamtaskmanager.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=teamtaskmanager.test_settings
      - run: python manage.py test --settings=teamtaskmanager.test_settings
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teamflow_test
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U teamflow -d teamflow_test" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      USE_POSTGRESQL: 'True'
      DB_NAME: teamflow_test
      DB_USER: teamflow
      DB_PASSWORD: test-only-password
      DB_HOST: localhost
      USE_IN_MEMORY_CHANNEL_LAYER: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -c requirements.lock.txt
      - run: python manage.py test --settings=teamtaskmanager.postgres_test_settings
